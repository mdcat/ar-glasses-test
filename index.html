<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d0c0b">
<title>글래스 핏 AR</title>
<style>
  /* 카메라 앱형 레이아웃: 화면 전체가 거울, 위에는 상태 표시, 아래에는 스타일 선택 바 */
  :root {
    --ink: #f4efe9;
    --ink-dim: rgba(244, 239, 233, .68);
    --glass: rgba(18, 15, 13, .62);
    --line: rgba(244, 239, 233, .16);
    --accent: #e0a458;
    --bg: #0d0c0b;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
    overflow: hidden; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  #stage { position: fixed; inset: 0; overflow: hidden; background: var(--bg); }
  /* 영상은 WebGL 캔버스 안에서 그리므로 원본 video는 화면에 보이지 않게 둠 */
  #video { position: absolute; left: 0; top: 0; width: 2px; height: 2px; opacity: 0; pointer-events: none; }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .mirror #gl { transform: scaleX(-1); }

  .top { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); pointer-events: none; }
  .brand { display: grid; gap: 2px; font-weight: 700; letter-spacing: .02em; font-size: 15px; text-shadow: 0 1px 8px rgba(0,0,0,.6); }
  .diag { font-weight: 400; font-size: 11px; line-height: 1.35; color: var(--ink-dim); white-space: pre; font-family: ui-monospace, Menlo, monospace; }
  .pill { background: var(--glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 12px; font-size: 13px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  .pill.ok { color: var(--ink); }
  .pill.warn { color: var(--accent); }

  .bar { position: fixed; left: 0; right: 0; bottom: 0;
    padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 16px) max(16px, env(safe-area-inset-left, 0px));
    background: linear-gradient(to top, rgba(13,12,11,.85), rgba(13,12,11,0)); }
  .bar-label { font-size: 12px; letter-spacing: .08em; color: var(--ink-dim); margin: 0 0 8px; text-transform: uppercase; }
  .chips { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 8px 14px 8px 8px; border-radius: 999px;
    background: var(--glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--line); cursor: pointer; }
  .chip[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sw { width: 26px; height: 26px; border-radius: 50%; position: relative; overflow: hidden; border: 1px solid rgba(255,255,255,.25); }
  .sw i { position: absolute; inset: 7px; border-radius: 50%; }

  .gate { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); background: var(--bg); text-align: center; }
  .gate-card { max-width: 360px; display: grid; gap: 14px; justify-items: center; }
  .gate h1 { margin: 0; font-size: 26px; letter-spacing: -.01em; text-wrap: balance; }
  .gate p { margin: 0; color: var(--ink-dim); text-wrap: balance; }
  .cta { margin-top: 6px; border: 0; border-radius: 999px; padding: 14px 26px; background: var(--accent); color: #1b130b; font-weight: 700; font-size: 16px; cursor: pointer; }
  .cta:disabled { opacity: .6; cursor: progress; }
  .cta:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .err { color: var(--accent); font-size: 14px; }
  .glyph { width: 120px; height: 48px; }

  .hint { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%); padding: 10px 16px; border-radius: 12px;
    background: var(--glass); border: 1px solid var(--line); color: var(--ink); font-size: 14px; white-space: nowrap; pointer-events: none; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs"
  }
}
</script>
</head>
<body>
  <div id="stage" class="mirror">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="gl"></canvas>
  </div>

  <div class="top">
    <span class="brand"><span id="ver">v3 (html)</span><span id="diag" class="diag"></span></span>
    <span id="status" class="pill">준비 중</span>
  </div>

  <div id="hint" class="hint" hidden>얼굴을 화면 가운데에 맞춰 주세요</div>

  <div class="bar" id="bar" hidden>
    <p class="bar-label">스타일</p>
    <div class="chips" id="chips" role="group" aria-label="안경 스타일 선택"></div>
  </div>

  <div class="gate" id="gate">
    <div class="gate-card">
      <svg class="glyph" viewBox="0 0 120 48" fill="none" aria-hidden="true">
        <path d="M8 14h40c2 0 3 1 3 3v6c0 10-7 17-17 17h-6C17 40 10 33 9 23L8 14Z" fill="rgba(42,32,24,.55)" stroke="#e0a458" stroke-width="3"/>
        <path d="M112 14H72c-2 0-3 1-3 3v6c0 10 7 17 17 17h6c11 0 18-7 19-17l1-9Z" fill="rgba(42,32,24,.55)" stroke="#e0a458" stroke-width="3"/>
        <path d="M51 18c3-3 15-3 18 0" stroke="#e0a458" stroke-width="3"/>
      </svg>
      <h1>카메라로 안경을 써 보세요</h1>
      <p>얼굴을 실시간으로 인식해 선글라스를 씌워 드립니다. 영상은 이 기기 안에서만 처리되고 어디에도 전송되지 않습니다.</p>
      <button class="cta" id="start" type="button">카메라 켜기</button>
      <p class="err" id="err" hidden></p>
    </div>
  </div>

  <script type="module" src="./app.js?v=3"></script>
</body>
</html>
